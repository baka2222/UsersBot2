upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Максимальный размер запроса (на случай длинных сценариев)
    # Поле изображения допускает файл до 10 МБ; оставляем запас для
    # multipart-формы вложенных сценариев.
    client_max_body_size 20m;

    # Статика админки — отдаёт напрямую Nginx (общий том с web)
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Загруженные оператором и полученные из Telegram изображения/стикеры.
    # Том общий с web и bot, поэтому файл остаётся доступен после перезапуска.
    location /media/ {
        alias /app/data/media/;
        access_log off;
        expires 7d;
    }

    # Всё остальное — в Django (gunicorn)
    location / {
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Origin $http_origin;

        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
